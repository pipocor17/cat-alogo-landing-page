    <style>

    /* Blindaje: el panel permanece oculto hasta que AuthGuard confirme licencia vigente */
        body:not(.cat-auth-unlocked) .app-container {
            display: none !important;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .topbar-plan-widget {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
        }
        .topbar-plan-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 13px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 700;
            white-space: nowrap;
            border: 1px solid #93c5fd;
            background: #eff6ff;
            color: #1d4ed8;
            line-height: 1.2;
        }
        .topbar-plan-pill.st-active {
            border-color: #6ee7b7;
            background: #ecfdf5;
            color: #047857;
        }
        .topbar-plan-pill.st-warn {
            border-color: #fcd34d;
            background: #fffbeb;
            color: #b45309;
        }
        .topbar-plan-pill.st-expired {
            border-color: #fca5a5;
            background: #fef2f2;
            color: #b91c1c;
        }
        .topbar-plan-pill.st-local {
            border-color: #cbd5e1;
            background: #f8fafc;
            color: #475569;
        }
        .topbar-upgrade-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border-radius: 10px;
            border: none;
            background: #047857;
            color: #ffffff;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(4, 120, 87, 0.22);
            transition: background 0.15s ease, transform 0.12s ease;
        }
        .topbar-upgrade-btn:hover {
            background: #065f46;
            transform: translateY(-1px);
        }
        .topbar-upgrade-btn:active {
            transform: translateY(0);
        }
        @media (max-width: 1120px) {
            .topbar-plan-pill {
                display: none;
            }
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

    <!-- Sincronización en vivo del indicador de Plan y botón Mejorar Plan en la barra superior -->
    <script>
        (function () {
            function actualizarWidgetPlanTopbar(sub) {
                const pill = document.getElementById('topbar-plan-pill');
                const btn = document.getElementById('btn-topbar-upgrade');
                if (!pill || !btn) return;

                const authState = window.CatAlogoAuth?.getState?.();
                const evalSub = sub || authState?.subscripcion;

                pill.classList.remove('st-active', 'st-warn', 'st-expired', 'st-local');

                if (authState?.modoLocalSinFirebase) {
                    pill.classList.add('st-local');
                    pill.textContent = 'Modo Local';
                    btn.textContent = '⭐ Mejorar Plan';
                    return;
                }

                if (!evalSub) {
                    pill.classList.add('st-local');
                    pill.textContent = 'Verificando plan…';
                    return;
                }

                const planRaw = String(evalSub.plan || '').toLowerCase();
                const esTrial = planRaw.includes('trial') || planRaw.includes('prueba') || planRaw === 'gratis' || planRaw === 'sin_plan' || planRaw === '';

                if (!evalSub.activa) {
                    pill.classList.add('st-expired');
                    pill.textContent = 'Plan vencido • 0 días';
                    btn.textContent = '⭐ Activar Plan';
                    return;
                }

                const dias = Number(evalSub.diasRestantes) || 0;
                const diasTxt = dias === 1 ? '1 día restante' : `${dias} día(s) restantes`;
                pill.textContent = `${evalSub.planLabel || 'Plan Activo'} • ${diasTxt}`;

                if (dias <= 5) {
                    pill.classList.add('st-warn');
                } else if (!esTrial) {
                    pill.classList.add('st-active');
                }
                // Si es trial con > 5 días, mantiene el estilo azul por defecto

                btn.textContent = esTrial ? '⭐ Mejorar Plan' : '⭐ Renovar Plan';
            }

            document.addEventListener('DOMContentLoaded', () => {
                document.getElementById('btn-topbar-upgrade')?.addEventListener('click', () => {
                    window.CatAlogoAuth?.abrirModalPlanes?.('anual');
                });
                actualizarWidgetPlanTopbar();
            });

            window.addEventListener('cat-alogo:suscripcion-actualizada', (e) => {
                actualizarWidgetPlanTopbar(e.detail);
            });

            window.addEventListener('cat-alogo:auth-cambiado', () => {
                actualizarWidgetPlanTopbar();
            });
        })();
    </script>
