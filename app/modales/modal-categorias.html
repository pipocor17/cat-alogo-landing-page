<div class="prod-modal-overlay" id="modal-gestor-categorias" aria-hidden="true">
    <div class="prod-modal-dialog cat-modal-dialog" role="dialog" aria-labelledby="modal-cat-title">
        
        <header class="prod-modal-header">
            <div class="cat-header-title">
                <span class="cat-header-icon">🏷️</span>
                <div>
                    <h2 id="modal-cat-title">Gestor de Categorías</h2>
                    <p class="prod-modal-sub">Al editar o eliminar una categoría, todos los productos que pertenezcan a ella se actualizarán de forma automática.</p>
                </div>
            </div>
            <button type="button" class="prod-modal-close" id="btn-cerrar-modal-cat" aria-label="Cerrar">✕</button>
        </header>

        <div class="prod-modal-body">
            <!-- Barra para crear nueva categoría -->
            <form id="form-nueva-categoria" class="cat-add-bar">
                <input type="text" id="input-nueva-categoria" placeholder="Ej: Alfajores, Bebidas, Calzado, Ferretería..." autocomplete="off" required>
                <button type="submit" class="inv-btn btn-save-primary">+ Agregar</button>
            </form>

            <!-- Buscador rápido dentro del gestor -->
            <div class="cat-search-bar">
                <span>🔍</span>
                <input type="text" id="input-buscar-categoria" placeholder="Filtrar categorías existentes...">
                <span class="cat-total-badge" id="cat-total-count">0 categorías</span>
            </div>

            <!-- Lista dinámica de categorías (estilo app móvil adaptado a web) -->
            <div class="cat-list-container" id="lista-gestor-categorias">
                <!-- Se renderiza automáticamente desde js/categorias.js -->
            </div>
        </div>

        <footer class="prod-modal-footer">
            <div class="footer-status-info">
                🔄 Sincronizado con Bóveda Local, Inventario y Modal de Productos
            </div>
            <button type="button" class="inv-btn inv-btn-light" id="btn-listo-modal-cat">Listo</button>
        </footer>

    </div>
</div>
