<div class="prod-modal-overlay" id="modal-editar-variante" aria-hidden="true">
    <div class="prod-modal-dialog var-modal-dialog" role="dialog" aria-labelledby="modal-var-title">
        
        <header class="prod-modal-header">
            <div>
                <h2 id="modal-var-title">Editar Variante</h2>
                <p class="prod-modal-sub" id="modal-var-parent">Producto principal</p>
            </div>
            <button type="button" class="prod-modal-close" id="btn-cerrar-modal-var" aria-label="Cerrar">✕</button>
        </header>

        <form id="form-editar-variante" class="prod-modal-body">
            <div class="var-form-stack">

                <!-- NOMBRE / TALLE Y CÓDIGO SKU -->
                <div class="field-row-2">
                    <div class="field-group">
                        <label for="var-edit-nombre">Nombre / Talle <span class="req">*</span></label>
                        <input type="text" id="var-edit-nombre" placeholder="Ej: XXL, Rojo, 42" required>
                    </div>
                    <div class="field-group">
                        <label for="var-edit-sku">Código SKU <span class="req">*</span></label>
                        <input type="text" id="var-edit-sku" placeholder="PRD-88464-S" required>
                    </div>
                </div>

                <!-- PRECIO NORMAL Y PRECIO OFERTA -->
                <div class="field-row-2">
                    <div class="field-group">
                        <label for="var-edit-precio">Precio de esta Variante ($) <span class="req">*</span></label>
                        <input type="number" id="var-edit-precio" step="0.01" min="0" required>
                    </div>
                    <div class="field-group">
                        <label for="var-edit-precio-oferta">Precio Oferta ($) <small style="font-weight:500; opacity:0.7;">(Opcional)</small></label>
                        <input type="number" id="var-edit-precio-oferta" step="0.01" min="0" placeholder="0 = Sin oferta">
                    </div>
                </div>

                <!-- STOCK Y COSTO OPCIONAL -->
                <div class="field-row-2">
                    <div class="field-group">
                        <label for="var-edit-stock">Stock Disponible</label>
                        <input type="number" id="var-edit-stock" step="1" min="0" required>
                    </div>
                    <div class="field-group">
                        <label for="var-edit-costo">Costo Interno ($) <small style="font-weight:500; opacity:0.7;">(Opcional)</small></label>
                        <input type="number" id="var-edit-costo" step="0.01" min="0" placeholder="Hereda del producto">
                    </div>
                </div>

                <!-- FOTO OPCIONAL DE ESTA VARIANTE -->
                <div class="form-section card-soft">
                    <label class="section-kicker">FOTO PROPIA DE ESTA VARIANTE (OPCIONAL)</label>
                    <div style="display:flex; align-items:center; gap:0.75rem; margin-top:0.5rem;">
                        <div id="var-img-thumb-box" style="width:64px; height:64px; border-radius:10px; border:1px dashed #cbd5e1; background:#f8fafc; overflow:hidden; display:flex; align-items:center; justify-content:center; flex-shrink:0; position:relative;">
                            <img id="var-img-preview" src="" alt="Foto variante" style="width:100%; height:100%; object-fit:cover; display:none;">
                            <span id="var-img-empty" style="font-size:0.7rem; color:#94a3b8; text-align:center; padding:4px; line-height:1.1;">Usa portada</span>
                        </div>
                        <div style="flex:1; display:flex; flex-direction:column; gap:0.45rem; min-width:0;">
                            <div style="display:flex; gap:0.4rem; flex-wrap:wrap;">
                                <label for="input-var-img-file" class="mini-btn" style="cursor:pointer; margin:0;">
                                    📁 Subir foto
                                </label>
                                <input type="file" id="input-var-img-file" accept="image/*" style="display:none;">
                                <button type="button" class="mini-btn btn-danger-soft" id="btn-var-quitar-img" style="display:none;">
                                    ✕ Quitar foto
                                </button>
                            </div>
                            <div style="display:flex; gap:0.35rem;">
                                <input type="url" id="input-var-img-url" placeholder="O pega una URL de imagen..." style="flex:1; min-width:0; padding:0.38rem 0.55rem; font-size:0.78rem; border:1px solid #cbd5e1; border-radius:8px;">
                                <button type="button" class="mini-btn" id="btn-var-aplicar-url" style="white-space:nowrap;">Aplicar</button>
                            </div>
                            <small style="font-size:0.7rem; color:#64748b;">También podés pegar una imagen directo con <strong>Ctrl + V</strong>. Si queda vacía, usa la portada general.</small>
                        </div>
                    </div>
                    <div id="var-img-status" style="display:none; margin-top:0.5rem; padding:0.45rem 0.65rem; border-radius:8px; font-size:0.74rem; font-weight:600;"></div>
                </div>

                <!-- SELECTOR DE BOLITA DE COLOR -->
                <div class="form-section card-soft">
                    <label class="section-kicker">COLOR IDENTIFICADOR (BOLITA)</label>
                    <div class="var-color-picker-row">
                        <div class="var-color-input-wrap">
                            <input type="color" id="var-edit-color" value="#1e3a8a" title="Elegir color personalizado">
                            <span id="var-color-hex">#1E3A8A</span>
                        </div>
                        <div class="var-color-swatches" id="var-color-swatches">
                            <button type="button" class="swatch-btn" data-color="#1e3a8a" style="background:#1e3a8a;" title="Azul Marino"></button>
                            <button type="button" class="swatch-btn" data-color="#0f766e" style="background:#0f766e;" title="Verde Esmeralda"></button>
                            <button type="button" class="swatch-btn" data-color="#d97706" style="background:#d97706;" title="Ámbar"></button>
                            <button type="button" class="swatch-btn" data-color="#6366f1" style="background:#6366f1;" title="Índigo"></button>
                            <button type="button" class="swatch-btn" data-color="#dc2626" style="background:#dc2626;" title="Rojo"></button>
                            <button type="button" class="swatch-btn" data-color="#111827" style="background:#111827;" title="Negro"></button>
                            <button type="button" class="swatch-btn" data-color="#d6cbb9" style="background:#d6cbb9;" title="Beige"></button>
                            <button type="button" class="swatch-btn" data-color="#ec4899" style="background:#ec4899;" title="Rosa"></button>
                        </div>
                    </div>
                </div>

            </div>
        </form>

        <footer class="prod-modal-footer">
            <button type="button" class="mini-btn btn-danger-soft" id="btn-eliminar-variante">🗑️ Eliminar variante</button>
            <div class="footer-btns">
                <button type="button" class="inv-btn inv-btn-light" id="btn-cancelar-modal-var">Cancelar</button>
                <button type="submit" form="form-editar-variante" class="inv-btn btn-save-primary">💾 Guardar Variante</button>
            </div>
        </footer>

    </div>
</div>
